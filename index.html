<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fer Agent · Building</title>
<meta name="theme-color" content="#CFE0F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1326" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cielo1: #CFE0F5; --cielo2: #F3F7FC;
    --fachada: #3B4A6B; --fachada2: #334160; --pilar: #2A3550; --rotulo: #222C45; --rotulo-tinta: #E9EDFB;
    --ventana: #FFF3D2; --ventana-trabajo: #FFE08A; --ventana-reposo: #E8EEF9; --ventana-hielo: #D6F0FF; --ventana-off: #5B6680;
    --papel: #FFFFFF; --papel2: #F3F5FD; --tinta: #1D2140; --suave: #5F658A; --linea: #D6DBF0;
    --acento: #3A9FE3; --sobre-acento: #FFFFFF; --neon: #FFC24B; --antena: #2A3550; --contorno: transparent;
    --ok: #2E9E5B; --aviso: #E8A21C; --peligro: #D64545; --hielo: #3B9AD9;
    --error-bg: #FDECEE; --error-ink: #9B1C2C;
    --display: "Fredoka", "Figtree", system-ui, sans-serif;
    --body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --cielo1: #0E1326; --cielo2: #1B2242;
      --fachada: #2C3757; --fachada2: #26304D; --pilar: #1B2238; --rotulo: #141A2C; --rotulo-tinta: #E9EDFB;
      --ventana: #4A4636; --ventana-trabajo: #8A6F2A; --ventana-reposo: #34405F; --ventana-hielo: #234A63; --ventana-off: #1C2235;
      --papel: #1C2037; --papel2: #232844; --tinta: #E8EAF7; --suave: #A2A8CB; --linea: #2E3456;
      --error-bg: #3B1A22; --error-ink: #FFB8C2; --antena: #8A93B8; --contorno: rgba(160, 175, 230, .22);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  :root { --pie: 52px; }
  body { background: var(--papel2); color: var(--tinta); font: 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid color-mix(in srgb, var(--acento) 70%, var(--tinta)); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* ---------- Top bar ---------- */
  .top { display: flex; align-items: center; gap: 12px; padding: 10px 18px; background: var(--papel); border-bottom: 1px solid var(--linea); flex-wrap: wrap; }
  .marca { font: 600 22px/1 var(--display); letter-spacing: .01em; }
  .marca small { font: 500 14px var(--body); color: var(--suave); margin-left: 8px; }
  .modo { font-size: 12.5px; padding: 3px 10px; border-radius: 999px; background: var(--papel2); border: 1px solid var(--linea); color: var(--suave); }
  .modo.casa { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
  .grow { flex: 1; }
  .medidor { display: grid; gap: 3px; min-width: 180px; cursor: pointer; border: 1px solid var(--linea); background: var(--papel2); border-radius: 12px; padding: 6px 12px; text-align: left; }
  .medidor .fila { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .barra { height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--tinta) 12%, transparent); overflow: hidden; }
  .barra i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .4s ease; }
  .barra i.c1 { background: var(--aviso); } .barra i.c2, .barra i.tope { background: var(--peligro); }
  .btn { border: 1px solid var(--linea); background: var(--papel); border-radius: 999px; padding: 7px 14px; font-size: 14px; font-weight: 500; white-space: nowrap; }
  .btn:hover { background: var(--papel2); }
  .btn.primario { background: var(--acento); color: var(--sobre-acento); border-color: transparent; font-weight: 600; }
  .btn.peligro { color: var(--peligro); }
  .btn.mini { padding: 3px 10px; font-size: 12.5px; }
  .btn.icono { position: relative; width: 38px; height: 38px; padding: 0; display: inline-grid; place-items: center; flex: none; }
  .btn.icono svg { width: 20px; height: 20px; }
  .punto-copia { position: absolute; top: 5px; right: 5px; width: 8px; height: 8px; border-radius: 50%; background: transparent; }
  .copia-btn.vieja { color: var(--peligro); border-color: var(--peligro); }
  .copia-btn.vieja .punto-copia { background: var(--peligro); }
  .informa-a { display: grid; gap: 6px; }
  .buscar-modelo { justify-self: start; margin-top: 4px; }
  .buscador-modelos { display: grid; gap: 6px; margin-top: 6px; }
  .busca-modelos { display: grid; gap: 2px; max-height: 260px; overflow-y: auto; border: 1px solid var(--linea); border-radius: 10px; padding: 4px; background: var(--papel); }
  .modelo-res { text-align: left; border: 0; background: transparent; padding: 6px 8px; border-radius: 6px; font-size: 13px; }
  .modelo-res:hover, .modelo-res:focus-visible { background: var(--papel2); }
  .solo-lector { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .btn:disabled { opacity: .5; cursor: default; }

  /* ---------- Layout ---------- */
  body { display: flex; flex-direction: column; height: 100dvh; }
  .top { flex: none; }
  .layout { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(400px, 1.25fr) minmax(360px, 1fr); }
  /* v8: the whole building full width; the profile only appears when you touch an agent or go into a floor */
  @media (min-width: 901px) {
    body:not(.con-panel) .layout { grid-template-columns: 1fr; }
    body:not(.con-panel) .panel { display: none; }
    body:not(.con-panel) .edificio:not(.abierta) { width: min(100% - 28px, 1320px); }
  }
  .cerrar-panel { margin-left: auto; align-self: center; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--linea); background: var(--papel); font-size: 15px; line-height: 1; color: var(--tinta2, inherit); }
  .cerrar-panel:hover { background: var(--papel); border-color: currentColor; }
  @media (max-width: 900px) { .cerrar-panel { display: none; } }
  @media (max-width: 480px) { .tramo .placa { top: var(--movil); } }   /* on a phone a floor is so low that the sign on top would cover heads: all of them, on their floor's slab */
  .panel { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--papel2); border-left: 1px solid var(--linea); }

  /* ---------- The city at night (always night, like the drawing) ---------- */
  .ciudad {
    --oro: #FFC56B; --oro-tinta: #FFE7B8; --coral: #FF8A65; --hielo-c: #8FD3FF; --apagado-c: #6B7290; --vidrio: rgba(9, 16, 52, .78); --borde-oro: rgba(255, 205, 130, .45);
    overflow-y: auto; position: relative; color: var(--oro-tinta);
    background:
      radial-gradient(1.2px 1.2px at 12% 8%, #fff 60%, transparent), radial-gradient(1px 1px at 33% 15%, #cfe0ff 60%, transparent),
      radial-gradient(1.4px 1.4px at 58% 5%, #fff 60%, transparent), radial-gradient(1px 1px at 77% 12%, #fff 60%, transparent),
      radial-gradient(1.2px 1.2px at 90% 4%, #dfe8ff 60%, transparent), radial-gradient(1px 1px at 22% 30%, #fff 60%, transparent),
      linear-gradient(180deg, #020B33 0%, #04145A 38%, #0A1F6E 70%, #241F5C 100%);
    background-attachment: local;
  }
  .ciudad-barra { position: sticky; top: 0; z-index: 3; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 12px 18px; background: linear-gradient(180deg, rgba(2, 11, 51, .96) 60%, rgba(2, 11, 51, 0)); }
  .ciudad-barra .pista { font-size: 13px; color: #B9C4F0; margin-left: auto; }
  .ciudad .btn { background: rgba(255, 255, 255, .07); color: var(--oro-tinta); border-color: var(--borde-oro); }
  .ciudad .btn:hover { background: rgba(255, 255, 255, .14); }
  .ciudad .btn.primario { background: var(--oro); color: #2B1A04; border-color: transparent; }
  .ciudad .btn.peligro { color: #FF9C8F; }
  .ciudad :focus-visible { outline-color: var(--oro); }
  .edificio { width: min(100% - 28px, 900px); margin: 6px auto 0; position: relative; }

  /* each piece of the drawing */
  .tramo { position: relative; width: 100%; }
  .tramo .fondo { position: absolute; inset: 0; width: 100%; height: 100%; display: block; user-select: none; }
  .tramo .entrar { position: absolute; inset: 0; border: 0; background: transparent; padding: 0; border-radius: 4px; }
  .tramo.piso .entrar:hover, .tramo.piso .entrar:focus-visible { box-shadow: inset 0 0 0 2px var(--oro), inset 0 0 40px rgba(255, 197, 107, .18); outline: 0; }
  .tramo.cupula .entrar:hover, .tramo.cupula .entrar:focus-visible { box-shadow: inset 0 -42px 30px -30px rgba(255, 197, 107, .35); outline: 0; }
  .tramo.vestibulo .entrar:hover, .tramo.vestibulo .entrar:focus-visible { box-shadow: inset 0 0 0 2px var(--oro); outline: 0; }
  .placa { position: absolute; left: 1.4%; top: var(--arriba); z-index: 2; display: inline-flex; gap: 8px; align-items: baseline; max-width: 70%;
    background: var(--vidrio); color: var(--oro-tinta); border: 1px solid var(--borde-oro); border-radius: 999px; padding: 1px 11px 2px; font-size: 12px; backdrop-filter: blur(3px); }
  .placa b { font: 600 13px/1.35 var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .placa span { opacity: .75; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mas { position: absolute; right: 1%; top: 34%; z-index: 2; background: var(--vidrio); color: var(--oro-tinta); border: 1px solid var(--borde-oro); border-radius: 999px; font: 600 12px var(--display); padding: 1px 8px; }
  .luz { position: absolute; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: #FF5A4E; z-index: 2; pointer-events: none; }
  .luz.late { animation: latido 1.2s ease-out; }
  @keyframes latido { 0% { box-shadow: 0 0 0 0 rgba(255, 90, 78, .8); transform: scale(1.4); } 100% { box-shadow: 0 0 0 16px rgba(255, 90, 78, 0); transform: scale(1); } }
  .suelo-calle { height: 22px; background: linear-gradient(180deg, #3A2E6B, #17123A); border-radius: 0 0 10px 10px; }

  /* the agents */
  .pj { position: absolute; transform: translateX(-50%); aspect-ratio: 433 / 880; border: 0; padding: 0; background: transparent; z-index: 1; }
  .pj img { width: 100%; height: 100%; object-fit: contain; display: block; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .35)); transition: transform .15s ease; pointer-events: none; }
  .pj:hover img { transform: translateY(-3%); }
  .pj.sel::after { content: ""; position: absolute; left: -20%; right: -20%; bottom: -3%; height: 9%; border-radius: 50%; border: 2px solid var(--oro); box-shadow: 0 0 10px var(--oro); }
  .pj.trabajando img { filter: drop-shadow(0 0 5px var(--oro)) drop-shadow(0 0 12px rgba(255, 197, 107, .7)); animation: trabaja 1.1s ease-in-out infinite alternate; }
  @keyframes trabaja { to { transform: translateY(-4%); } }
  .pj.congelado img { filter: saturate(.25) brightness(1.15) drop-shadow(0 0 4px #8FD3FF) drop-shadow(0 0 9px #8FD3FF); }
  .pj.apagado img { filter: grayscale(1) brightness(.55); }
  .pj .pendiente { position: absolute; left: 50%; top: -9%; width: 22%; aspect-ratio: 1; margin-left: -11%; border-radius: 50%; background: var(--coral); box-shadow: 0 0 6px var(--coral); }
  .pj .etiqueta { position: absolute; top: calc(100% + 3px); left: 50%; transform: translateX(-50%); white-space: nowrap; font: 600 12px/1.3 var(--display); background: var(--vidrio); color: var(--oro-tinta); border: 1px solid var(--borde-oro); border-radius: 999px; padding: 0 8px; }
  /* v8: the agent's name on hover; the floor also lights up when hovering over its sign */
  .pj .etiqueta.al-pasar { opacity: 0; pointer-events: none; transition: opacity .12s; z-index: 3; }
  .pj:hover, .pj:focus-visible { z-index: 4; }
  .pj:hover .etiqueta.al-pasar, .pj:focus-visible .etiqueta.al-pasar { opacity: 1; }
  .tramo.piso:has(.placa:hover) .entrar { box-shadow: inset 0 0 0 2px var(--oro), inset 0 0 40px rgba(255, 197, 107, .18); }
  .tramo.cupula:has(.placa:hover) .entrar { box-shadow: inset 0 -42px 30px -30px rgba(255, 197, 107, .35); }
  .tramo.vestibulo:has(.placa:hover) .entrar { box-shadow: inset 0 0 0 2px var(--oro); }
  .hueco { position: absolute; transform: translateX(-50%); aspect-ratio: 1; border-radius: 50%; border: 2px dashed rgba(255, 231, 184, .7); background: rgba(9, 16, 52, .35); color: var(--oro-tinta); font: 600 18px/1 var(--display); padding: 0; opacity: .55; display: grid; place-items: center; }
  .hueco:hover, .hueco:focus-visible { opacity: 1; background: rgba(9, 16, 52, .6); }

  /* a floor from the inside */
  .edificio.abierta { width: min(100% - 28px, 1400px); padding-top: 16px; }
  .planta-cab { display: grid; gap: 2px; margin-bottom: 12px; }
  .volver { justify-self: start; background: transparent; border: 0; color: #B9C4F0; padding: 2px 0; font-weight: 600; font-size: 14px; }
  .volver:hover { color: var(--oro-tinta); }
  .nombre-planta { font: 600 28px/1.2 var(--display); color: var(--oro-tinta); background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 2px 6px; margin-left: -7px; width: 100%; }
  .funcion-planta { font-size: 15px; line-height: 1.4; color: #C9D2F5; background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 2px 6px; margin-left: -7px; width: 100%; resize: none; field-sizing: content; min-height: 1.6em; }
  .nombre-planta:hover, .nombre-planta:focus, .funcion-planta:hover, .funcion-planta:focus { border-color: var(--borde-oro); background: rgba(255, 255, 255, .05); }
  .planta-datos { margin: 2px 0 0; font-size: 13px; color: #9FAADB; font-variant-numeric: tabular-nums; }
  .tira { display: flex; overflow-x: auto; overflow-y: hidden; padding-bottom: 30px; border-radius: 12px; scrollbar-color: var(--borde-oro) transparent; }
  .modulo { position: relative; flex: none; height: var(--h); width: calc(var(--h) * var(--w) / 260);
    background: url(img/piso2x.webp) no-repeat; background-size: calc(var(--h) * 2876 / 260) var(--h); background-position: calc(var(--h) * var(--x0) / -260) 0; }
  .tira.cupula, .tira.vestibulo { padding-bottom: 34px; }
  .lienzo { position: relative; flex: none; height: var(--h); width: calc(var(--h) * (var(--x1) - var(--x0)) / (var(--y1) - var(--y0))); background-repeat: no-repeat; border-radius: 12px;
    background-size: calc(var(--h) * var(--W) / (var(--y1) - var(--y0))) calc(var(--h) * var(--A) / (var(--y1) - var(--y0)));
    background-position: calc(var(--h) * var(--x0) * -1 / (var(--y1) - var(--y0))) calc(var(--h) * var(--y0) * -1 / (var(--y1) - var(--y0))); }
  .tira.cupula { justify-content: safe center; }
  .plano { position: relative; display: flex; width: max-content; max-width: 100%; margin: 0 0 10px; border-radius: 8px; overflow: hidden; cursor: pointer; opacity: .9; }
  .plano .modulo { pointer-events: none; }
  .plano .pj { pointer-events: none; }
  .plano .pj img { filter: none; }
  .ventana-plano { position: absolute; top: 0; bottom: 0; border: 2px solid var(--oro); border-radius: 6px; box-shadow: 0 0 0 999px rgba(2, 11, 51, .35); pointer-events: none; }
  .marco-tira { position: relative; }
  .flecha { position: absolute; top: calc(var(--h, 250px) / 2 - 22px); width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--borde-oro); background: var(--vidrio); color: var(--oro-tinta); font: 600 26px/1 var(--display); display: none; place-items: center; padding: 0 0 3px; z-index: 3; }
  .flecha.izq { left: 8px; } .flecha.der { right: 8px; }
  .marco-tira.hay-izq .flecha.izq, .marco-tira.hay-der .flecha.der { display: grid; }
  .marco-tira { --h: 250px; }
  .directorio { margin: 22px 0 8px; display: grid; gap: 8px; }
  .directorio h3 { margin: 0 0 2px; font: 600 18px var(--display); color: var(--oro-tinta); }
  .fila-dir { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; text-align: left; background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 205, 130, .22); border-radius: 14px; padding: 9px 14px; color: var(--oro-tinta); }
  .fila-dir:hover { background: rgba(255, 255, 255, .11); border-color: var(--borde-oro); }
  .d-txt { display: grid; min-width: 0; }
  .d-txt b { font: 600 15.5px/1.25 var(--display); }
  .d-txt small { color: #AEB8E6; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .caras { display: flex; align-items: center; }
  .caras img { width: 28px; height: 28px; object-fit: cover; object-position: 50% 0; border-radius: 50%; background: #1B2A78; border: 2px solid #0B1A5E; margin-left: -6px; }
  .caras img.congelado { filter: saturate(.25) brightness(1.15); } .caras img.apagado { filter: grayscale(1) brightness(.6); }
  .caras i { font-style: normal; font-size: 12px; margin-left: 4px; color: #AEB8E6; }
  .d-gasto { font-size: 12.5px; color: #AEB8E6; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .planta-acciones { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 16px; }
  .quienes { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; padding-bottom: 28px; }
  .quien { display: flex; gap: 10px; align-items: center; text-align: left; background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 205, 130, .22); border-radius: 14px; padding: 8px 12px 8px 8px; color: var(--oro-tinta); }
  .quien:hover { background: rgba(255, 255, 255, .11); }
  .quien.sel { border-color: var(--oro); }
  .quien img { width: 40px; height: 64px; object-fit: cover; object-position: 50% 0; flex: none; border-radius: 10px; background: rgba(255, 255, 255, .06); }
  .quien.congelado img { filter: saturate(.25) brightness(1.15); } .quien.apagado img { filter: grayscale(1) brightness(.6); }
  .q-txt { display: grid; min-width: 0; }
  .q-txt b { font: 600 15px/1.25 var(--display); }
  .q-txt small { color: #AEB8E6; font-size: 12px; line-height: 1.35; }
  .planta-vacia { color: #B9C4F0; }
  .leyenda { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; font-size: 12.5px; color: #B9C4F0; padding: 16px 12px 26px; }
  .leyenda i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: 0; margin-right: 5px; }
  .l-trabajando { background: var(--oro); box-shadow: 0 0 6px var(--oro); } .l-pendiente { background: var(--coral); } .l-congelado { background: var(--hielo-c); } .l-apagado { background: var(--apagado-c); }
  @media (prefers-reduced-motion: reduce) { .luz.late, .pj.trabajando img { animation: none; } .pj img { transition: none; } }

  .otra-pestana { position: fixed; inset: 0; z-index: 40; background: rgba(2, 11, 51, .92); display: grid; place-items: center; padding: 24px; color: #FFE7B8; text-align: center; }
  .otra-pestana > div { max-width: 30em; display: grid; gap: 10px; }
  .otra-pestana h2 { margin: 0; font: 600 26px/1.2 var(--display); }
  .otra-pestana p { margin: 0; color: #DCE3FF; }
  .otra-pestana .nota { color: #AEB8E6; }

  /* ---------- Strips (big building) ---------- */
  .interruptor { display: inline-flex; }
  .interruptor .btn { border-radius: 0; } .interruptor .btn:first-child { border-radius: 999px 0 0 999px; } .interruptor .btn:last-child { border-radius: 0 999px 999px 0; margin-left: -1px; }
  .ciudad .interruptor .btn[aria-pressed="true"] { background: rgba(255, 197, 107, .22); border-color: var(--oro); }
  .tramo.franja .fondo { filter: brightness(.42) saturate(.8); }
  .franja-txt { position: absolute; inset: 0; z-index: 2; display: flex; align-items: center; gap: 4%; padding: 0 3%; pointer-events: none; color: var(--oro-tinta); }
  .franja-txt .f-nombre { display: grid; min-width: 0; flex: 1; }
  .franja-txt b { font: 600 clamp(13px, 1.7vw, 19px)/1.15 var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .franja-txt small { font-size: clamp(10.5px, 1.1vw, 12.5px); color: #C9D2F5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .franja-txt .f-datos { text-align: right; font-size: clamp(11px, 1.15vw, 13px); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .puntos { display: flex; flex-wrap: wrap; gap: 3px; justify-content: flex-end; margin-top: 4px; max-width: 220px; margin-left: auto; }
  .puntos i { width: 7px; height: 7px; border-radius: 50%; background: #E9EDFB; opacity: .75; }
  .puntos i.trabajando { background: var(--oro); opacity: 1; box-shadow: 0 0 5px var(--oro); } .puntos i.activo { background: var(--coral); opacity: 1; }

  .redactor .fila { display: grid; grid-template-columns: auto auto 1fr auto auto; gap: 8px; align-items: end; }

  /* profile */
  .ficha-cab { display: flex; gap: 14px; align-items: center; }

  .prioridad button[aria-pressed="true"] { background: var(--acento); color: var(--sobre-acento); border-color: transparent; }
  .gastos3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

  .est.hecha { color: var(--ok); } .est.pendiente { color: var(--aviso); } .est.error, .est.descartada { color: var(--peligro); } .est.repetida { color: var(--hielo); }
  .registro .item { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: baseline; }

  /* ---------- Side drawer ---------- */
  .velo { position: fixed; inset: 0; background: color-mix(in srgb, #000 35%, transparent); z-index: 10; }
  .velo.claro { background: transparent; }
  .cajon { position: fixed; top: 0; right: 0; bottom: var(--pie); width: min(480px, 100%); z-index: 11; background: var(--papel); border-left: 1px solid var(--linea); display: flex; flex-direction: column; box-shadow: -18px 0 40px color-mix(in srgb, #000 18%, transparent); }

  .tramos div { display: flex; gap: 8px; align-items: baseline; }

  .aspecto { display: grid; gap: 12px; }

  .colores { display: grid; gap: 10px; }

  /* ---------- Bottom strip (leaves room for Netlify's badge) ---------- */

  .como-clave a { color: color-mix(in srgb, var(--acento) 80%, var(--tinta)); font-weight: 600; text-underline-offset: 2px; }
  #landing .aviso-l { font-size: 14px; opacity: .78; max-width: 62ch; }
  .pie { flex: none; height: var(--pie); display: flex; align-items: center; padding: 0 18px; font-size: 12px; color: var(--suave); background: var(--papel); border-top: 1px solid var(--linea); }

  @media (max-width: 1560px) { .top .modo { display: none; } }
  /* ---------- Mobile ---------- */
  .solo-movil { display: none; }
  @media (max-width: 900px) {
    .top { flex: none; }
    .modo { display: none; }
    .layout { flex: 1; min-height: 0; display: flex; flex-direction: column; height: auto; }
    .panel { order: 1; flex: 1; min-height: 0; border-left: 0; }
    .ciudad { order: 2; display: none; }
    body.ver-edificio .panel { flex: none; }
    body.ver-edificio .ciudad { display: block; flex: 1; min-height: 0; overflow-y: auto; }
    body.ver-edificio .panel .vista { display: none !important; }
    .pestanas { overflow-x: auto; padding: 6px 8px 0; }
    .pestanas button { padding: 8px 10px; white-space: nowrap; }
    .solo-movil { display: block; }
    .top { padding: 8px 12px; gap: 8px; }
    .marca small { display: none; }
    .medidor { min-width: 0; flex: 1 1 auto; }
    .gasto-grupo { flex: 1 1 100%; order: 5; }
    .copia-btn { order: 6; }
    .pausa-txt small { display: none; }
    .edificio, .edificio.abierta { width: calc(100% - 16px); }
    .ciudad-barra { padding: 10px 8px; }
    .ciudad-barra .pista { display: none; }
    .placa { font-size: 10px; padding: 0 7px; gap: 5px; }
    .placa b { font-size: 10px; line-height: 1.3; }
    .placa span { display: none; }
    .tira, .marco-tira { --h: 180px; }
    .fila-dir { grid-template-columns: 1fr auto; }
    .d-gasto { display: none; }
    .nombre-planta { font-size: 23px; }
    .cajon { top: auto; height: calc(90% - var(--pie)); width: 100%; border-left: 0; border-top: 1px solid var(--linea); border-radius: 22px 22px 0 0; }
    .cajon.bajo { height: calc(100% - 120px - var(--pie)); }
    .dos { grid-template-columns: 1fr; }
    .redactor .fila { grid-template-columns: auto auto 1fr auto; }
    .top .btn { padding: 6px 11px; font-size: 13px; }
    #abrirMes, #abrirSalas { order: 4; }
    .bandeja .p-coste { margin-left: 0; }
    .chat-cuerpo { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .chat-pj { flex-direction: row; justify-content: flex-start; padding: 10px 14px; gap: 12px; text-align: left; }
    .pj-grande { height: 92px; }
    .chat-quien h2 { font-size: 21px; }
    .chat-quien p { font-size: 13px; }
    .pasos, .control, .lugares { grid-template-columns: 1fr; }
    .heroe::after { background: linear-gradient(0deg, rgba(2, 8, 40, .92) 0%, rgba(2, 8, 40, .55) 45%, rgba(2, 8, 40, 0) 72%); }
    .heroe { align-items: end; } .heroe-txt { padding-bottom: 80px; }
    .heroe > img { object-position: 78% 50%; }
    .salas { grid-template-columns: 1fr; }
    .podio img { height: 80px; } .podio .primero img { height: 110px; }
    .franja-txt .puntos { display: none; }
    .pantalla-cab .nota-osc { display: none; }
    .volver-btn { white-space: nowrap; }
    #enviar { grid-column: 1 / -1; width: 100%; }
  }
</style>
</head>
<body>
<!-- Home page: the landing (filled in by landing.js) -->
<div class="portada" id="portada"><div id="landing"></div></div>

<header class="top">
  <button class="marca" id="irPortada" type="button" title="Go to the home page">Fer Agent<small id="nombreEdificio">My building</small></button>
  <span class="modo" id="modo">In this browser</span>
  <span class="grow"></span>
  <button class="btn primario" id="hablarJefe">Talk to the boss</button>
  <button class="btn" id="abrirBandeja" title="What&#x27;s waiting for your yes">Inbox<span class="globo" id="globoBandeja" hidden></span></button>
  <button class="btn" id="abrirMes">Agent of the month<span class="globo" id="globoMes" hidden></span></button>
  <button class="btn" id="abrirSalas">Meetings</button>
  <span class="gasto-grupo">
    <button class="medidor" id="medidor" title="See the spending and who spends when they wake up">
      <span class="fila"><span id="medHoy">Today, no spending</span><span id="medTope">cap $1</span></span>
      <span class="barra"><i id="medBarra"></i></span>
    </button>
    <button class="pausa-btn" id="pausa" type="button" aria-pressed="true" title="Master switch for everything automatic">
      <span class="pausa-ico" aria-hidden="true"></span><span class="pausa-txt"><b id="pausaTxt">Paused</b><small id="pausaSub">nothing spends on its own</small></span>
    </button>
  </span>
  <button class="btn icono copia-btn" id="copiaRapida" type="button" title="Save a backup of the whole building now" aria-label="Save backup"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h11l3 3v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm2 0v5h8V3M7 21v-7h10v7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><i class="punto-copia" aria-hidden="true"></i><small id="copiaCuando" class="solo-lector">never</small></button>
  <button class="btn icono" id="abrirAjustes" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zm7.4-2.1.1-1.4-.1-1.4 2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-2.4-1.4L14.2 2h-4l-.4 2.6a7.6 7.6 0 0 0-2.4 1.4l-2.4-1-2 3.4 2 1.6-.1 1.4.1 1.4-2 1.6 2 3.4 2.4-1a7.6 7.6 0 0 0 2.4 1.4l.4 2.6h4l.4-2.6a7.6 7.6 0 0 0 2.4-1.4l2.4 1 2-3.4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></button>
</header>

<div class="layout">
  <section class="ciudad" aria-label="Building">
    <div class="ciudad-barra" id="ciudadBarra">
      <button class="btn mini volver-portada" id="volverPortada" type="button">← Back to the home page</button>
      <button class="btn primario mini" id="crearAgente">Create agent</button>
      <button class="btn mini" id="crearPiso">Create floor</button>
      <button class="btn mini" id="abrirSerie">Built-in agents</button>
      <button class="btn mini" id="abrirActividad">Activity</button>
      <span class="interruptor" role="group" aria-label="How the building is shown">
        <button class="btn mini" id="verDibujo" aria-pressed="false">Drawing</button><button class="btn mini" id="verFranjas" aria-pressed="false">Strips</button>
      </span>
      <span class="pista">Tap a floor to go in, or an agent to see their profile</span>
    </div>
    <div class="edificio" id="edificio"></div>
    <div class="leyenda">
      <span><i class="l-trabajando"></i>working</span>
      <span><i class="l-pendiente"></i>with pending tasks</span>
      <span><i class="l-congelado"></i>frozen by spending</span>
      <span><i class="l-apagado"></i>off</span>
    </div>
  </section>

  <section class="panel" id="panel">
    <nav class="pestanas" role="tablist">
      <button role="tab" id="tabEdificio" class="solo-movil" aria-selected="false">Building</button>
      <button role="tab" id="tabFicha" aria-selected="true">Profile</button>
      <button role="tab" id="tabActividad" aria-selected="false">Activity</button>
      <button class="cerrar-panel" id="cerrarPanel" type="button" title="Close and see the whole building" aria-label="Close">✕</button>
    </nav>
    <div class="vista" id="vistaFicha"><div class="scroll" id="ficha"></div></div>
    <div class="vista" id="vistaActividad" hidden>
      <div class="sub-pestanas" role="tablist">
        <button role="tab" id="actTodo" aria-selected="true">Everything</button>
        <button role="tab" id="actJev" aria-selected="false">Questions to JEV</button>
      </div>
      <div class="scroll"><div class="lista registro" id="registro"></div></div>
    </div>
  </section>
</div>

<!-- Bottom strip: leaves free the corner where Netlify puts its badge, so it doesn't cover anything -->
<footer class="pie"><span>Fer Agent · open source · version <span id="version"></span></span></footer>

<!-- Chat with an agent, full screen -->
<section class="pantalla" id="vistaChat" hidden aria-label="Chat">
  <header class="pantalla-cab">
    <button class="volver-btn" id="cerrarChat">← Back to the building</button>
    <span class="grow"></span>
    <button class="btn mini" id="verFichaChat">See their profile</button>
    <button class="btn mini" id="nuevaConv" title="Start a new conversation">New conversation</button>
  </header>
  <div class="chat-cuerpo">
    <aside class="chat-pj" id="jefeCab">
      <div class="pj-grande" id="marcoJefe" title="Tap to make it stop talking"><img id="avatar" alt=""></div>
      <div class="chat-quien">
        <h2 id="jefeNombre">Boss</h2>
        <p id="jefeRol" class="nota"></p>
        <p id="jefeEstado">Ready to talk</p>
        <button class="parar-btn" id="pararVoz" type="button" hidden><span class="cuadro" aria-hidden="true"></span>Stop</button>
      </div>
    </aside>
    <div class="chat-principal">
      <div class="scroll" id="chat"><div id="mensajes"></div></div>
      <div class="redactor">
        <div class="fila">
          <button class="redondo" id="micro" aria-pressed="false" title="Talk through the mic (conversation mode)" aria-label="Microphone">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
          </button>
          <button class="redondo" id="clip" title="Attach an image for it to see" aria-label="Attach image">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.5l-8.4 8.4a5.5 5.5 0 0 1-7.8-7.8l8.8-8.8a3.7 3.7 0 0 1 5.2 5.2l-8.8 8.8a1.8 1.8 0 0 1-2.6-2.6l8-8"/></svg>
          </button>
          <textarea id="texto" rows="1" placeholder="Type here…" aria-label="Message"></textarea>
          <button class="redondo" id="altavoz" aria-pressed="false" title="Read the replies out loud" aria-label="Speaker">
            <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
            <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
          </button>
          <button class="btn primario" id="enviar">Send</button>
        </div>
        <div class="adjunto" id="adjunto" hidden><img id="adjuntoImg" alt=""><span>Attached image</span><button class="btn mini" id="quitarAdjunto">Remove</button></div>
        <input type="file" id="fichero" accept="image/*" hidden>
        <div id="pista" aria-live="polite"></div>
      </div>
    </div>
  </div>
</section>

<!-- Agent of the month -->
<section class="pantalla oscura" id="vistaMes" hidden aria-label="Agent of the month"></section>
<!-- Meeting rooms -->
<section class="pantalla oscura" id="vistaSalas" hidden aria-label="Meeting rooms"></section>
<!-- Approval inbox -->
<section class="pantalla oscura" id="vistaBandeja" hidden aria-label="Approval inbox"></section>

<section class="pantalla oscura" id="vistaSerie" hidden aria-label="Built-in agents"></section>

<div class="velo" id="velo" hidden></div>
<aside class="cajon" id="cajon" hidden role="dialog" aria-modal="true" aria-labelledby="cajonTitulo">
  <header><button class="btn" id="cerrarCajon">← Back</button><h2 id="cajonTitulo">Settings</h2></header>
  <div class="scroll" id="cajonCuerpo"></div>
</aside>

<script type="module" src="app.js"></script>
</body>
</html>
