# Fabrica la aplicación de escritorio de Fer Agent (Mac y Windows) en las máquinas de GitHub.
# - A mano: pestaña «Actions» → «Aplicación» → «Run workflow». Los instaladores quedan en «Artifacts» de esa ejecución.
# - Con una versión (por ejemplo v9.0.0), al lanzarlo a mano o con una etiqueta: además se publican en «Releases».
name: Aplicación

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión que se publica en Releases (por ejemplo v9.0.0). Vacío: solo se fabrican."
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  fabricar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            orden: --mac
          - os: windows-latest
            orden: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fabricar los instaladores
        run: npx electron-builder ${{ matrix.orden }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: fer-agent-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error
      - name: Publicar en Releases (solo con versión)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Fer Agent ${{ inputs.version || github.ref_name }}
          files: |
            dist/*.dmg
            dist/*.exe
          draft: false
          prerelease: ${{ contains(inputs.version || github.ref_name, '-') }}
          body: |
            Fer Agent desktop app · Mac (Apple chip: `mac-arm64`; Intel: `mac-x64`) and Windows (`.exe`).
            First time on a Mac: System Settings → Privacy & Security → **Open Anyway**. On Windows: **More info → Run anyway**.
            Then paste your OpenRouter key in Settings.
