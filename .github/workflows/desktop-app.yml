# Builds the Fer Agent desktop app (Mac and Windows) on GitHub's machines.
# - By hand: "Actions" tab → "Desktop app" → "Run workflow". The installers are left in that run's "Artifacts".
# - With a version (for example v9.0.0), when run by hand or with a tag: they are also published in "Releases".
# - On the v9-completa branch (before it's in main, where "Run workflow" lives): a push whose message says [build installers].
name: Desktop app

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version published in Releases (for example v9.0.0). Empty: they are only built."
        required: false
        default: ""
  push:
    tags: ["v*"]
    branches: ["v9-completa"]

permissions:
  contents: write

jobs:
  build:
    # a push to the branch builds only when its message asks for it (the others are skipped at once and cost nothing)
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[build installers]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            orden: --mac
          - os: windows-latest
            orden: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the installers
        run: npx electron-builder ${{ matrix.orden }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: fer-agent-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error
      - name: Publish in Releases (only with a version)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Fer Agent ${{ inputs.version || github.ref_name }}
          files: |
            dist/*.dmg
            dist/*.exe
          draft: false
          prerelease: ${{ contains(inputs.version || github.ref_name, '-') }}
          body: |
            Fer Agent desktop app · Mac: `Fer-Agent-mac.dmg` (any Mac, Apple chip or Intel) · Windows: `Fer-Agent-windows.exe`.
            First time on a Mac: System Settings → Privacy & Security → **Open Anyway**. On Windows: **More info → Run anyway**.
            Then paste your OpenRouter key in Settings.
