# Checks the Apple secrets without showing them: it says only whether CSC_LINK is a real .p12 certificate that opens with
# CSC_KEY_PASSWORD, whose name it is, and whether the other three look right. Run it by hand: Actions → «Check the Apple secrets» → Run workflow.
name: Check the Apple secrets
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check
        run: |
          ok=1
          clean=$(printf '%s' "$CSC_LINK" | tr -d '\r\n\t ')
          echo "CSC_LINK: ${#CSC_LINK} characters (${#clean} without spaces or line breaks)"
          if [ "${#clean}" -lt 2048 ]; then
            echo "::error::CSC_LINK is too short to be the certificate. Copy the base64 of the .p12 again and paste it."
            ok=0
          elif ! printf '%s' "$clean" | base64 -d > cert.p12 2>/dev/null; then
            echo "::error::CSC_LINK is not valid base64."
            ok=0
          else
            if openssl pkcs12 -in cert.p12 -nokeys -passin env:CSC_KEY_PASSWORD -out cert.pem 2>/dev/null \
               || openssl pkcs12 -legacy -in cert.p12 -nokeys -passin env:CSC_KEY_PASSWORD -out cert.pem 2>/dev/null; then
              echo "The certificate opens with CSC_KEY_PASSWORD."
              openssl x509 -in cert.pem -noout -subject -enddate
              if openssl pkcs12 -in cert.p12 -nocerts -nodes -passin env:CSC_KEY_PASSWORD 2>/dev/null | grep -q "PRIVATE KEY" \
                 || openssl pkcs12 -legacy -in cert.p12 -nocerts -nodes -passin env:CSC_KEY_PASSWORD 2>/dev/null | grep -q "PRIVATE KEY"; then
                echo "It carries its private key."
              else
                echo "::error::The .p12 has no private key: export it from «My Certificates» in Keychain Access."
                ok=0
              fi
            else
              echo "::error::The certificate does not open with CSC_KEY_PASSWORD (wrong password, or not a .p12)."
              ok=0
            fi
          fi
          rm -f cert.p12 cert.pem
          if printf '%s' "$APPLE_APP_SPECIFIC_PASSWORD" | grep -Eq '^[a-z]{4}-[a-z]{4}-[a-z]{4}-[a-z]{4}$'; then
            echo "APPLE_APP_SPECIFIC_PASSWORD: looks right (xxxx-xxxx-xxxx-xxxx)."
          else
            echo "::error::APPLE_APP_SPECIFIC_PASSWORD doesn't look like an app-specific password (xxxx-xxxx-xxxx-xxxx)."
            ok=0
          fi
          if printf '%s' "$APPLE_ID" | grep -q '@'; then echo "APPLE_ID: looks like an email."; else echo "::error::APPLE_ID is not an email."; ok=0; fi
          if [ "${#APPLE_TEAM_ID}" -eq 10 ]; then echo "APPLE_TEAM_ID: 10 characters."; else echo "::error::APPLE_TEAM_ID should have 10 characters."; ok=0; fi
          [ "$ok" -eq 1 ] && echo "All the Apple secrets look right." || exit 1
